; ============================================================
;  EPOS CubeSat — MPU9250 + Kalman 3 eixos (Roll / Pitch / Yaw)
;  Roll e Pitch: fusão acelerômetro + giroscópio
;  Yaw: fusão magnetômetro (com compensação de inclinação) + giroscópio
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    hideakitai/MPU9250 @ ^0.4.8
